name: Build Enhanced APK

on:
  push:
    branches:
      - enhanced-home-screen
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Enhanced APK
        run: ./gradlew assembleEnhanced

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep "versionName" app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/' || echo "unknown")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/enhanced/app-enhanced.apk release/jellyfin-androidtv-enhanced-${{ steps.version.outputs.VERSION }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-androidtv-enhanced-${{ steps.version.outputs.VERSION }}
          path: release/*.apk
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.apk
          generate_release_notes: true
          body: |
            ## Jellyfin Android TV Enhanced - ${{ steps.version.outputs.VERSION }}

            ### Enhanced Features
            - Enhanced home screen with hero section
            - Dynamic backdrop and metadata display
            - Settings-based toggle (disabled by default)

            ### Installation
            This is a custom build that can run alongside the official Jellyfin app from the Play Store.

            **App ID:** `org.jellyfin.androidtv.enhanced`
            **App Name:** Jellyfin Enhanced

            Download the APK below and install via ADB or directly on your Android TV device.

            ### Update Instructions
            To check for updates in the future:
            1. Open the app
            2. Go to Settings → About
            3. Tap "Check for updates"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
